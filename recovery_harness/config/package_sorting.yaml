skill_registry: skill_registry.yaml

vlm:
  backend: qwen2_5_vl
  model_path: /media/data/jiayi/hf_model/Qwen2.5-VL-7B-Instruct
  device_map: auto
  dtype: bfloat16

cameras:
  head:
    enabled: true
  left_wrist:
    enabled: true
  right_wrist:
    enabled: false

ros:
  topics:
    head_rgb: /cam_h/color/image_raw/compressed
    left_wrist_rgb: /cam_l/color/image_raw/compressed
    right_wrist_rgb: /cam_r/color/image_raw/compressed
    tactile: /dexhand/touch_state
    robot_state: /sensors_data_raw
    pause_state: /kuavo/pause_state
    stop_state: /kuavo/stop_state

perception:
  roi_config: /media/data/jiayi/dataset/roi_config.json
  detector_plugin: recovery_harness.plugins.grounding_dino_sam2:create_detector
  detector_plugin_config:
    dino_model: /home/kuavo/.cache/huggingface/hub/models--IDEA-Research--grounding-dino-tiny/snapshots/a2bb814dd30d776dcf7e30523b00659f4f141c71
    sam2_source_root: /media/data/jiayi/sam2
    sam2_config: /media/data/jiayi/sam2/sam2/configs/sam2.1/sam2.1_hiera_s.yaml
    sam2_checkpoint: /media/data/jiayi/sam2/checkpoints/sam2.1_hiera_small.pt
    device: cuda:1
    package_labels: [blue mailer bag, pink padded envelope]
    detect_every_frames: 5
    max_target_instances: 6
  max_track_age_seconds: 1.5

tactile:
  # Calibrate on unloaded sensors. No thresholds are inferred from aggregate force.
  finger_force_thresholds: null
  # status semantics are not defined by the available driver source; configure only after verifying driver docs.
  valid_status_values: null
  sustain_seconds: 0.1

runtime:
  max_observation_age_seconds: 0.5
  max_vlm_result_age_seconds: 3.0  # Keep stale-result gate; record completion and consumption ages before considering any retuning.
  reasoning_interval_seconds: 1.0
  diagnostic_output_dir: outputs/recovery_harness/live_dry_run_diagnostics
  motion_enabled: false

triggers:
  confidence_threshold: 0.5
  mask_confidence_threshold: 0.5
  max_detector_evidence_age_seconds: 1.0
  persistence_hits: 2
  cooldown_seconds: 3.0
  position_delta_px: 30.0

