env:  # 推理环境设置
  inference_env: sim  # 选仿真还是真机 option: sim/real
  platform_type: "4pro"  # 机器人型号
  which_arm: both  # 控制左手、右手还是双手
  eef_type: rq2f85  # 夹爪或手型类型
  ros_rate: 10  # 推理频率
  direct_to_wbc: false  # 是否使用direct to wbc模式。
  enable_action_interpolation: true
  control_rate: 100  # WBC插值后的实际控制指令频率
  

inference:  # 推理和评测设置
  go_bag_path: null    # bag 回放路径
  policy_type: client  # 要加载的模型类型,外挂模式选择client, 选择client模式后下面的pretrained_path失去作用
  pretrained_path: /path/to/checkpoint  # 要加载的权重路径。
  eval_episodes: 10  # 评测跑多少条
  max_episode_steps: 200  # 每条最多跑多少步

  task_prompt: "robot manipulation"
  async_inference: true  # 使用异步 chunk 推理 + 固定频率控制
  async_control_hz: 10.0  # 异步控制线程频率，0 表示使用 env.ros_rate
  async_buffer_size: 48
  async_low_watermark: 16
  async_warmup_actions: 16
  async_warmup_timeout: 10.0
  async_action_timeout: 0.02
  save_rollout_video: false  # 关闭逐帧写图，避免拖慢控制循环
